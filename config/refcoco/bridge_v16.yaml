DATA:
  dataset: refcoco
  train_lmdb: datasets/lmdb/refcoco/train.lmdb
  train_split: train
  val_lmdb: datasets/lmdb/refcoco/val.lmdb
  val_split: val
  mask_root: datasets/masks/refcoco
TRAIN:
  # Base Arch
  clip_pretrain: pretrain/ViT-B-16.pt
  input_size: 416
  word_len: 17
  word_dim: 512
  ladder_dim: 64
  nhead: 4
  multi_stage: 3
  stride: [1, 1, 1]
  vis_dim: 512
  fpn_in: [768, 768, 512]
  fpn_out: [256, 512, 1024]
  sync_bn: True
  # Decoder
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.1
  intermediate: False
  # Training Setting
  workers: 12  # data loader workers
  workers_val: 12
  epochs: 50
  milestones: [30]
  start_epoch: 0
  batch_size: 16  # batch size for training
  batch_size_val: 16  # batch size for validation during training, memory and speed tradeoff
  base_lr: 0.0001
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.01
  max_norm: 0
  batchnorm: True
  lang_fusion_type: multi
  bilinear: True
  manual_seed: 0
  print_freq: 100
  threshold: 0.5
  auto_calibrate_thresh: False
  # Resume & Save
  exp_name: B_V16
  output_folder:  exp/refcoco_ETOG_coderelease  #exp/refcoco #
  save_freq: 1
  weight:  # path to initial weight (default: none)
  resume:   # path to latest checkpoint (default: none)
  evaluate: True  # evaluate on validation set, extra gpu memory needed and small batch_size_val is recommend

  USE_AFE: True
  AFE_N: 2
  AFE_DROP_PATH: 0.1
  AFE_EXPAND: 4
  AFE_K: 3
  AFE_DILATED_MLP: True
  AFE_GAMMA_INIT: 0.5

  # -------------------------------
  # Knowledge Distillation & EMA
  # -------------------------------
  USE_KD: True
  USE_EMA_TEACHER: True
  EMA_MOMENTUM: 0.9999
  KD_T: 2.5
  KD_W_LOGIT: 0.1
  KD_W_FEAT: 0.0
  KD_W_ATTN: 0.02
  KD_FEAT_NORM: cosine
  KD_WARMUP_STEPS: 2650
  KD_RAMP_STEPS: 7950
  KD_WEIGHT_MAX: 0.65
  TEACHER_CHECKPOINT: ""
  EMA_EVAL_FROM_EPOCH: 8
  warmup_epochs: 0
  min_lr_ratio: 0.1

