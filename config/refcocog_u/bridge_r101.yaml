DATA:
  dataset: refcocog_u
  train_lmdb: datasets/lmdb/refcocog_u/train.lmdb
  train_split: train
  val_lmdb: datasets/lmdb/refcocog_u/val.lmdb
  val_split: val
  mask_root: datasets/masks/refcocog_u
TRAIN:
  # Base Arch
  clip_pretrain: pretrain/RN101.pt
  input_size: 416
  word_len: 22
  word_dim: 512
  ladder_dim: 128
  nhead: 4
  multi_stage: 3
  stride: [2, 1, 2]
  vis_dim: 512
  fpn_in: [512, 1024, 512]
  fpn_out: [256, 512, 1024]
  sync_bn: True
  # Decoder
  num_layers: 3
  num_head: 8
  dim_ffn: 512
  dropout: 0.2
  intermediate: False
  # Training Setting
  workers: 12  # data loader workers
  workers_val: 12
  epochs: 50
  milestones: [30]
  start_epoch: 0
  batch_size: 64  # batch size for training
  batch_size_val: 64  # batch size for validation during training, memory and speed tradeoff
  base_lr: 0.00025
  lr_decay: 0.1
  lr_multi: 1
  weight_decay: 0.05
  max_norm: 0.
  batchnorm: True
  lang_fusion_type: multi
  bilinear: True
  manual_seed: 0
  print_freq: 100
  threshold: 0.5
  auto_calibrate_thresh: True
  # Resume & Save
  exp_name: B_R101
  output_folder: exp/refcocog_u
  save_freq: 1
  weight:  # path to initial weight (default: none)
  resume:  # path to latest checkpoint (default: none)
  evaluate: True  # evaluate on validation set, extra gpu memory needed and small batch_size_val is recommend

  USE_AFE: True
  AFE_N: 2
  AFE_DROP_PATH: 0.1
  AFE_EXPAND: 4
  AFE_K: 3
  AFE_DILATED_MLP: True
  AFE_GAMMA_INIT: 0.5

  # -------------------------------
  # Knowledge Distillation & EMA (与 RN50 改进一致)
  # -------------------------------
  USE_KD: True
  USE_EMA_TEACHER: True
  EMA_MOMENTUM: 0.9995
  KD_T: 3.0
  KD_W_LOGIT: 0.06
  KD_W_FEAT: 0.06
  KD_W_ATTN: 0.012
  KD_FEAT_NORM: cosine
  KD_WARMUP_STEPS: 2600
  KD_RAMP_STEPS: 17000
  KD_WEIGHT_MAX: 0.7
  TEACHER_CHECKPOINT: ""
  EMA_EVAL_FROM_EPOCH: 8

  # Warmup + Cosine Scheduler
  warmup_epochs: 3
  min_lr_ratio: 0.1
Distributed:
  dist_url: tcp://localhost:3681
  dist_backend: 'nccl'
  multiprocessing_distributed: True
  world_size: 1
  rank: 0
TEST:
  test_split: val-test
  test_lmdb: datasets/lmdb/refcocog_u/test.lmdb
  visualize: False